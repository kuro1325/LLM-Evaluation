name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 安装依赖
        run: npm ci

      - name: 构建静态网页
        run: npm run build:pages

      - name: 上传网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
